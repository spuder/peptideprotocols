name: Re-scrape peptide protocol pages

on:
  schedule:
    - cron: "0 9 * * 1"   # weekly, Monday 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python -m scraper.core

      - name: Commit changes if anything moved
        run: |
          git config user.name "peptide-archive-bot"
          git config user.email "actions@github.com"
          git add data/ markdown/
          git diff --cached --quiet || git commit -m "chore: scheduled re-scrape $(date -u +%Y-%m-%d)"
          git push
